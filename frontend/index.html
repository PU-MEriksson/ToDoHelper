<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>To Do Helper</title>
  </head>
  <body>
    <header>
      <!-- <nav class="navbar">
        <ul>
          <li><a href="#">Hem</a></li>
          <li><a href="#">Om oss</a></li>
          <li><a href="#">Kontakt</a></li>
        </ul>
      </nav> -->
    </header>
    <main>
      <!-- <h1>Skriv in det du vill få gjort i fältet nedan</h1> -->
      <div class="input-container">
        <div class="to-do-header">
          <h2>Att göra-lista</h2>
          <img
            src="./images/notebook.png"
            alt="Bild på en anteckningsbok"
            height="50px"
          />
          <!-- Nivån på hur detaljerat svaret ska vara -->
        </div>
        <div class="detail-level">
          <label for="detailed">Detaljnivå:</label>
          <select id="detailed">
            <option value="low">Låg</option>
            <option value="medium">Medel</option>
            <option value="high">Hög</option>
          </select>
        </div>
        <div class="to-do-body">
          <input
            type="text"
            id="input-field"
            placeholder="Skriv in det du vill få gjort här t.ex. 'Städa köket'"
          />
          <img
            src="./images/add-button.png"
            alt="Ett plustecken"
            id="add-button"
            onclick="CreateToDoItem"
          />
        </div>
        <div id="output">
          <h5 id="alert"></h5>
          <ul id="to-do-items" class="to-do-items"></ul>
        </div>
      </div>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
