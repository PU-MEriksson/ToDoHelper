<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="#">Hem</a></li>
          <li><a href="#">Om oss</a></li>
          <li><a href="#">Kontakt</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>To Do Helper</h1>
      <article>
        <h3>Hur sidan används</h3>
        <p>
          Skriv in det du behöver göra, och du kommer få det nedbrutet i mindre
          delar.
        </p>
      </article>
      <form action="">
        <input
          type="text"
          name="todo"
          id="todo"
          placeholder="Skriv in det du vill få gjort här, t.ex. 'Städa rummet', Gå ut med soporna', Planera middag'"
        />
      </form>
    </main>
  </body>
</html>
